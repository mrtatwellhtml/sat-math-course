site_name: SAT Math - Foundations to Mastery
site_description: A complete, self-paced SAT Math course from arithmetic foundations to the hardest Module 2 questions.
site_url: https://mrtatwellhtml.github.io/sat-math-course/
repo_url: https://github.com/mrtatwellhtml/sat-math-course
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - assets/stylesheets/course.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.tabbed: { alternate_style: true }

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search

# nav is generated by scripts/sync_nav.py - do not edit by hand


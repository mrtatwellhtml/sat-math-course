<title>Test Craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ SAT Math deck — premium slide shell ============ */
:root{
  --ease:cubic-bezier(.16,1,.3,1);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  /* light */
  --base:#F7F5F1; --surf:#FFFFFF; --rise:#FFFFFF; --rise2:#F3F0EA;
  --line:rgba(16,24,40,.12); --line2:rgba(16,24,40,.22);
  --ink:#121923; --mid:#3D4A5C; --mute:#6B7A8E;
  --gold:#9A6B18; --gold-d:#7E5611; --goldw:rgba(154,107,24,.10);
  --good:#117A52; --goodw:rgba(17,122,82,.10);
  --bad:#B6301F; --badw:rgba(182,48,31,.09);
  --on-gold:#FFFFFF; --goldb:rgba(154,107,24,.32);
  --shadow:0 18px 50px -26px rgba(16,24,40,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --base:#070A12; --surf:#0E1420; --rise:#151D2D; --rise2:#1B2436;
    --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
    --ink:#EDF1F8; --mid:#B4C0D2; --mute:#7E8DA4;
    --gold:#E2B465; --gold-d:#C2914A; --goldw:rgba(226,180,101,.13);
    --good:#4FD6A0; --goodw:rgba(79,214,160,.12);
    --bad:#FF7E6E; --badw:rgba(255,126,110,.11);
    --on-gold:#17120A; --goldb:rgba(226,180,101,.30);
    --shadow:0 24px 70px -28px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --base:#070A12; --surf:#0E1420; --rise:#151D2D; --rise2:#1B2436;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#EDF1F8; --mid:#B4C0D2; --mute:#7E8DA4;
  --gold:#E2B465; --gold-d:#C2914A; --goldw:rgba(226,180,101,.13);
  --good:#4FD6A0; --goodw:rgba(79,214,160,.12);
  --bad:#FF7E6E; --badw:rgba(255,126,110,.11);
  --on-gold:#17120A; --goldb:rgba(226,180,101,.30);
  --shadow:0 24px 70px -28px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  background:var(--base); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.5;
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 520px at 78% -10%, var(--goldw), transparent 65%),
    radial-gradient(700px 480px at -5% 105%, rgba(79,214,160,.07), transparent 62%);
}

/* ---------- chrome ---------- */
#top{
  position:fixed; top:0; left:0; right:0; height:52px; z-index:30;
  display:flex; align-items:center; gap:14px; padding:0 20px;
  font-size:12.5px; letter-spacing:.02em;
}
#brand{display:flex;align-items:baseline;gap:10px;min-width:0}
#deckName{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#deckSession{color:var(--mute);white-space:nowrap;font-size:11.5px}
#top .sp{flex:1}
.tbtn{
  appearance:none;border:1px solid var(--line);background:transparent;color:var(--mid);
  font:inherit;font-size:11.5px;padding:5px 11px;border-radius:999px;cursor:pointer;
  transition:all .18s var(--ease); white-space:nowrap;
}
.tbtn:hover{border-color:var(--line2);color:var(--ink);background:var(--rise)}
#counter{color:var(--mute);font-variant-numeric:tabular-nums;font-size:11.5px}

#rail{position:fixed;top:0;left:0;right:0;height:2px;z-index:31;background:var(--line)}
#railFill{height:100%;width:0;background:linear-gradient(90deg,var(--gold-d),var(--gold));
  transition:width .55s var(--ease)}

/* ---------- stage ---------- */
#stage{position:fixed;inset:52px 0 62px;z-index:1}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.slide::-webkit-scrollbar{width:7px}
.slide::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.sl{
  min-height:100%; width:min(1120px,100%); margin:0 auto;
  padding:30px 32px 40px; display:flex; flex-direction:column;
}
.slide.in{animation:sIn .55s var(--ease) both}
.slide.in.back{animation:sInB .55s var(--ease) both}
.slide.nomo{animation:none!important}
@keyframes sIn{from{opacity:0;transform:translate3d(28px,0,0) scale(.985)}to{opacity:1;transform:none}}
@keyframes sInB{from{opacity:0;transform:translate3d(-28px,0,0) scale(.985)}to{opacity:1;transform:none}}

.r{opacity:0;transform:translateY(16px);filter:blur(7px);
  transition:opacity .62s var(--ease) var(--d,0ms),transform .62s var(--ease) var(--d,0ms),filter .62s var(--ease) var(--d,0ms)}
.r.on{opacity:1;transform:none;filter:none}
@media (prefers-reduced-motion:reduce){
  .r{transition-duration:.01ms!important}
  .slide.in,.slide.in.back{animation:none}
}

/* ---------- typography ---------- */
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;
  color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:9px;
}
.eyebrow::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent);max-width:160px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,6.6vw,86px);line-height:1.02;
  letter-spacing:-.018em;margin:0 0 18px}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,50px);line-height:1.08;
  letter-spacing:-.012em;margin:0 0 16px}
h2.sh{font-size:clamp(25px,3.1vw,38px);margin-bottom:18px}
.lede{font-size:clamp(15px,1.7vw,20px);color:var(--mid);max-width:62ch;margin:0;line-height:1.55}
.lead{font-size:clamp(14.5px,1.5vw,17.5px);color:var(--mid);max-width:70ch;margin:0 0 22px;line-height:1.6}

/* ---------- title / section ---------- */
.sl-title,.sl-section{justify-content:center;padding-top:10px}
.sl-title h1{max-width:17ch}
.tmeta{display:flex;flex-wrap:wrap;gap:34px;margin-top:38px;padding-top:24px;border-top:1px solid var(--line)}
.tmeta span{display:flex;flex-direction:column;gap:3px;font-size:11.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--mute)}
.tmeta b{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink)}
.sl-section h2{font-size:clamp(34px,5.2vw,64px);max-width:16ch}
.sl-close h2{color:var(--gold)}

/* ---------- lists ---------- */
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px}
.pts li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(14.5px,1.5vw,18px);line-height:1.55;color:var(--mid)}
.dot{flex:0 0 7px;height:7px;border-radius:50%;background:var(--gold);margin-top:.55em;
  box-shadow:0 0 0 4px var(--goldw)}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{display:flex;gap:16px;align-items:flex-start;background:var(--rise);border:1px solid var(--line);
  border-radius:14px;padding:15px 18px}
.step i{flex:0 0 28px;height:28px;border-radius:9px;background:var(--goldw);color:var(--gold);
  display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12.5px;font-family:var(--mono)}
.step div{display:flex;flex-direction:column;gap:4px;min-width:0}
.step b{font-size:clamp(14.5px,1.45vw,17px);font-weight:700;color:var(--ink);line-height:1.4}
.step span{font-size:14px;color:var(--mute);line-height:1.5}

.recap{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.recap li{display:flex;gap:16px;align-items:flex-start;font-size:clamp(15px,1.6vw,19px);
  line-height:1.5;color:var(--mid);padding-bottom:14px;border-bottom:1px solid var(--line)}
.recap li:last-child{border-bottom:0}
.recap i{font-family:var(--serif);font-style:normal;font-size:28px;color:var(--gold);
  line-height:1;flex:0 0 32px;opacity:.85}

.callout{margin-top:22px;background:var(--goldw);border:1px solid var(--goldb);
  border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:15px 19px;
  font-size:clamp(14px,1.45vw,16.5px);line-height:1.55;color:var(--ink)}

/* ---------- table ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--rise)}
table{width:100%;border-collapse:collapse;font-size:clamp(13.5px,1.35vw,16px)}
th{text-align:left;padding:12px 16px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mute);font-weight:700;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--mid);vertical-align:top}
tr:last-child td{border-bottom:0}
td.k{color:var(--ink);font-weight:600}
tr.good td{background:var(--goodw)} tr.bad td{background:var(--badw)}

/* ---------- compare ---------- */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:18px 20px;background:var(--rise)}
.card.bad{border-color:rgba(255,126,110,.32);background:var(--badw)}
.card.good{border-color:rgba(79,214,160,.32);background:var(--goodw)}
.ctag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;margin-bottom:11px}
.card.bad .ctag{color:var(--bad)} .card.good .ctag{color:var(--good)}
.cbody{font-family:var(--mono);font-size:clamp(13px,1.35vw,15.5px);line-height:1.85;color:var(--ink)}

/* ---------- worked example ---------- */
.qbox{border:1px solid var(--line2);border-radius:16px;background:var(--rise);padding:18px 20px;margin-bottom:18px}
.qtag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--gold);margin-bottom:9px}
.qstem{font-size:clamp(15px,1.6vw,19px);line-height:1.55;color:var(--ink)}
.think{background:var(--rise2);border-radius:12px;padding:13px 17px;margin-bottom:16px;
  font-size:clamp(13.5px,1.4vw,16px);color:var(--mid);line-height:1.55}
.think b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.wsteps{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:0}
.wsteps li{display:flex;gap:16px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.wsteps li:last-child{border-bottom:0}
.wsteps i{flex:0 0 24px;height:24px;border-radius:7px;border:1px solid var(--line2);color:var(--mute);
  display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;font-family:var(--mono)}
.wsteps div{font-size:clamp(14px,1.45vw,17px);line-height:1.6;color:var(--mid)}
.ans{margin-top:auto;display:flex;align-items:center;gap:14px;background:var(--goodw);
  border:1px solid rgba(79,214,160,.32);border-radius:14px;padding:14px 20px}
.ans span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--good)}
.ans b{font-family:var(--serif);font-weight:400;font-size:clamp(22px,2.6vw,32px);color:var(--ink);line-height:1}

/* ---------- practice ---------- */
.qgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.qgrid.n1,.qgrid.n3{grid-template-columns:1fr 1fr}
.qgrid.n1{grid-template-columns:1fr}
.q{border:1px solid var(--line);border-radius:16px;background:var(--rise);padding:16px 18px;
  display:flex;flex-direction:column;gap:11px;transition:border-color .25s var(--ease)}
.q.open{border-color:var(--line2)}
.qhead{display:flex;gap:8px;flex-wrap:wrap;min-height:1px}
.chip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  padding:3px 9px;border-radius:999px;background:var(--goldw);color:var(--gold)}
.chip.w{background:transparent;border:1px solid var(--line2);color:var(--mute)}
.qs{font-size:clamp(14px,1.4vw,16.5px);line-height:1.55;color:var(--ink)}
.opts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}
.opts li{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--line);
  border-radius:10px;cursor:pointer;font-size:14px;color:var(--mid);
  transition:all .18s var(--ease);user-select:none}
.opts li:hover{border-color:var(--line2);background:var(--rise2)}
.opts kbd{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--mute);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px;flex:0 0 auto}
.opts li.pick{border-color:var(--line2);background:var(--rise2)}
.opts li.right{border-color:var(--good);background:var(--goodw);color:var(--ink)}
.opts li.right kbd{color:var(--good);border-color:var(--good)}
.opts li.wrong{border-color:var(--bad);background:var(--badw)}
.opts li.wrong kbd{color:var(--bad);border-color:var(--bad)}
.show{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--mid);
  font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:9px;cursor:pointer;
  align-self:flex-start;transition:all .18s var(--ease)}
.show:hover{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.q.open .show{display:none}
.sol[hidden]{display:none}
.sol{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:9px;
  animation:fadeU .4s var(--ease) both}
@keyframes fadeU{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.solA{font-family:var(--serif);font-size:clamp(19px,2vw,25px);color:var(--good);line-height:1.2}
.solT{font-size:14px;line-height:1.6;color:var(--mid)}
.solW{font-size:13px;line-height:1.55;color:var(--mute);background:var(--badw);
  border-radius:9px;padding:9px 12px}
.solW b{color:var(--bad);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  display:block;margin-bottom:3px}
.revealAll{appearance:none;margin:18px auto 0;border:1px dashed var(--line2);background:transparent;
  color:var(--mute);font:inherit;font-size:12.5px;padding:9px 20px;border-radius:999px;cursor:pointer;
  transition:all .18s var(--ease)}
.revealAll:hover:not(:disabled){color:var(--ink);border-color:var(--gold)}
.revealAll:disabled{opacity:.4;cursor:default}

/* ---------- bottom bar ---------- */
#bot{position:fixed;bottom:0;left:0;right:0;height:62px;z-index:30;
  display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(to top,var(--base) 55%,transparent)}
.nav{appearance:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--surf);color:var(--mid);cursor:pointer;display:grid;place-items:center;
  transition:all .2s var(--ease)}
.nav:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.nav svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hint{font-size:11px;color:var(--mute);letter-spacing:.04em}
#notes{position:fixed;bottom:62px;left:0;right:0;z-index:29;background:var(--rise2);
  border-top:1px solid var(--line);padding:13px 24px;font-size:13.5px;color:var(--mid);
  max-height:30vh;overflow:auto;line-height:1.55}

/* ---------- overview ---------- */
#overview{position:fixed;inset:0;z-index:40;background:rgba(247,245,241,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow:auto;padding:60px 24px;opacity:0;transition:opacity .22s var(--ease)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #overview{background:rgba(7,10,18,.86)}}
:root[data-theme="dark"] #overview{background:rgba(7,10,18,.86)}
#overview.on{opacity:1}
#ovGrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  max-width:1100px;margin:0 auto}
.ovc{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surf);
  border-radius:12px;padding:13px 15px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;
  color:var(--mid);font:inherit;font-size:13.5px;line-height:1.4;transition:all .18s var(--ease)}
.ovc:hover{border-color:var(--gold);color:var(--ink);transform:translateY(-2px)}
.ovc i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--mute);flex:0 0 auto;padding-top:2px}

/* ---------- responsive ---------- */
@media (max-width:860px){
  .cmp,.qgrid,.qgrid.n3{grid-template-columns:1fr}
  .sl{padding:22px 16px 34px}
  .tmeta{gap:22px}
}
@media (max-width:560px){
  .opts{grid-template-columns:1fr}
  #hint{display:none}
  #top{gap:9px;padding:0 13px}
  #deckSession{display:none}
}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
mjx-container svg{vertical-align:-.12em}

</style>

<div id="rail"><div id="railFill"></div></div>

<header id="top">
  <div id="brand"><span id="deckName"></span><span id="deckSession"></span></div>
  <span class="sp"></span>
  <span id="counter">1 / 1</span>
  <button class="tbtn" id="ovBtn" title="Overview (O)">Contents</button>
  <button class="tbtn" id="notesBtn" title="Tutor notes (N)">Notes</button>
  <button class="tbtn" id="thBtn" title="Theme">Theme</button>
  <button class="tbtn" id="fsBtn" title="Fullscreen (F)">Full</button>
</header>

<main id="stage"></main>

<div id="notes" hidden></div>

  <button class="nav" id="next" aria-label="Next slide">
    <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
</footer>

<div id="overview" hidden><div id="ovGrid"></div></div>

<script>

  document.getElementById('thBtn').addEventListener('click', function(){
    var n = r.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', n);
    try{ localStorage.setItem(k,n); }catch(e){}
  });
})();

<script>
var DECK = {"id":"sat-testcraft","title":"Test Craft","session":"Session 10 · 29 November","slides":[{"type":"title","eyebrow":"Session 10 · 29 November","title":"Test Craft","sub":"The last Sunday before the exam. No new mathematics — this hour is about the marks you lose for reasons that have nothing to do with whether you can do the maths.","meta":[{"v":"6","k":"days to go"},{"v":"95s","k":"per question"},{"v":"22","k":"questions today"}],"notes":"Keep this hour calm and concrete. He does not need adrenaline six days out; he needs a protocol he can follow when he is nervous."},{"type":"idea","kicker":"Why this is a lesson","title":"Marks you already know how to get","lead":"On the September diagnostic you lost marks three ways that had nothing to do with not knowing the maths.","points":["Questions you never reached, because earlier ones took too long.","Questions you answered correctly and then typed in a form the machine does not accept.","Questions you could have done in fifteen seconds with Desmos and spent two minutes on by hand."],"callout":"None of those need new knowledge. All three are fixed by a protocol you decide on now, in a calm room, rather than invent on Saturday morning in a hall.","notes":"Anchor every point to something he actually did. Vague advice about \"time management\" will not survive the exam; a specific rule will."},{"type":"section","kicker":"Part one","title":"The shape of the thing","sub":"You cannot pace yourself in a room whose rules you are still working out."},{"type":"table","kicker":"What happens on the day","title":"The maths section, start to finish","lead":"Two modules. You cannot go back to module one once it is submitted, and module two is chosen for you based on how module one went.","cols":["","Module 1","Module 2"],"rows":[{"cells":["Questions","22","22"]},{"cells":["Time","35 minutes","35 minutes"]},{"cells":["Difficulty","Mixed — easy to hard","Easier or harder, depending on module 1"]},{"cells":["Can you go back?","Within the module, yes","Within the module, yes"]},{"cells":["Desmos","On every question","On every question"]},{"cells":["Reference sheet","On every question","On every question"]}],"callout":"Of the 44 questions, four are unscored trial questions and you will never know which. That is the real reason not to let one question eat your module — it might not even count.","notes":"The adaptivity point matters emotionally: module two feeling hard is a good sign, not a bad one. Tell him that now so it does not frighten him on the day."},{"type":"idea","kicker":"The clock","title":"Ninety-five seconds, and what that actually means","lead":"35 minutes across 22 questions is 95 seconds each. But the questions are not equal, so the average is not a target — it is a budget.","points":["The early questions in a module are usually quicker. Bank time there, deliberately.","Spending three minutes on one question means two others get forty seconds each.","Every question is worth the same mark. A hard one is a bad investment, not a challenge.","Finishing with five minutes left is not wasted time — it is five minutes of checking."],"callout":"The hard rule: **if you are ninety seconds in and have no route, flag it and move on.** Not \"nearly there\" — no route. You come back with whatever time is left.","notes":"Have him practise the flag-and-move this week on a timed set. It feels wrong the first few times and that is exactly why it needs rehearsing."},{"type":"steps","kicker":"The protocol","title":"Three passes through the module","lead":"Do not work through 1 to 22 in order and hope. Go through the module three times, each time doing something different.","steps":[{"label":"Pass one — the ones you can see","body":"Answer everything that has an obvious route. Flag anything that does not within about fifteen seconds of reading it. Aim to be at the end of the module in roughly twenty minutes."},{"label":"Pass two — the flagged ones","body":"Now you know how much time you have and how many are left. Spend it on the flagged questions, hardest last."},{"label":"Pass three — guard the easy marks","body":"With whatever is left, re-read the questions you answered fast. That is where careless marks hide, not in the hard ones."},{"label":"Never leave anything blank","body":"There is no penalty for a wrong answer. In the last minute, put something in every empty box."}],"callout":"Pass three is the one students skip, and it is the one that pays. A question you rushed in forty seconds is far more likely to be wrong than one you flagged and thought about.","notes":"Write the three passes on his scratch card. He should do his last practice test with this protocol, not without it."},{"type":"section","kicker":"Part two","title":"Answer entry","sub":"About a quarter of the maths questions ask you to type the answer rather than pick it. The machine marks what you typed, not what you meant."},{"type":"steps","kicker":"The rules","title":"How to type a write-in answer","lead":"These are the official rules. They are not guidelines — an answer that breaks them is marked wrong even when the mathematics is perfect.","steps":[{"label":"Five characters, or six if it is negative","body":"The minus sign counts as one of the six. Anything longer will not fit."},{"label":"Fractions and decimals are both fine","body":"You never have to simplify. $\\dfrac{6}{8}$ is accepted; so is $0.75$."},{"label":"Never a mixed number","body":"Two and a half must be typed as $5/2$ or $2.5$. Typing $2\\ 1/2$ is read as twenty-one halves."},{"label":"Repeating decimals: fill the space","body":"$\\dfrac{2}{3}$ can be entered as $2/3$, or as $.6666$, or as $.6667$. Entering $.66$ is marked wrong — you must round or truncate at the fourth digit, not before."},{"label":"No symbols at all","body":"No percent sign, no dollar sign, no comma, no units. One thousand two hundred and fifty is typed $1250$, never $1{,}250$ or $\\$1250$."}],"callout":"If the question asks \"what percent\" and the answer is forty-two percent, you type $42$. If it asks \"what is the probability\" and the answer is forty-two percent, you type $0.42$. Read which one it wants.","notes":"This slide is worth two or three marks on its own. Do not rush it — make him say each rule back."},{"type":"practice","kicker":"Drill","title":"Answer entry — would it be accepted?","lead":"No mathematics here at all. Just the typing rules.","questions":[{"tag":"warm-up","stem":"The answer to a write-in question is two and one half. Which of the following entries would **not** be accepted?","choices":["$5/2$","$2.5$","$2\\ 1/2$","$2.50$"],"answer":"C","solution":"Mixed numbers are never accepted. The box reads $2\\ 1/2$ as twenty-one halves, which is $10.5$.","trap":"A) is the improper fraction, which is exactly what you are meant to type; B) is the decimal equivalent and fits in five characters; D) is the same decimal with a trailing zero, four characters, also fine."},{"tag":"warm-up","stem":"The answer to a write-in question is $\\dfrac{2}{3}$. Which of the following entries would **not** be accepted?","choices":["$2/3$","$.6666$","$.6667$","$.66$"],"answer":"D","solution":"A repeating decimal must be filled out to the fourth digit, either truncated or rounded. $.66$ stops two digits early, so it is marked wrong.","trap":"A) is the fraction itself, always the safest entry; B) is the decimal truncated at the fourth digit; C) is the same decimal rounded at the fourth digit — both of those are accepted."},{"tag":"medium","stem":"A question asks for a cost in dollars and the answer is one thousand two hundred and fifty dollars. What should you type?","choices":["$\\$1250$","$1{,}250$","$1250$","$1250$ dollars"],"answer":"C","solution":"Digits only. The dollar sign, the comma and the word \"dollars\" are all symbols or text, and none of them belong in the box.","trap":"A) adds a dollar sign; B) adds a comma; D) adds the unit as a word. Each of those is read as an invalid entry even though the number is right."},{"tag":"medium","stem":"A question asks what percent of the members chose the first option, and the answer is forty-two percent. What should you type?","choices":["$42$","$42\\%$","$0.42$","$.42\\%$"],"answer":"A","solution":"The question has already said \"what percent\", so the units are built into the question. You type the number alone: $42$.","trap":"B) adds a percent sign, which is not allowed; C) is the decimal form, which answers \"what proportion\" rather than \"what percent\"; D) does both wrong things at once."}],"notes":"Four minutes. These are free marks and he should get all four — if he does not, that is a conversation worth having now rather than on Saturday."},{"type":"practice","kicker":"Drill","title":"Answer entry — the awkward ones","lead":"Negatives, long decimals, and the character limit.","questions":[{"tag":"medium","stem":"The answer to a write-in question is $-\\dfrac{17}{4}$. Which of the following entries would **not** be accepted?","choices":["$-17/4$","$-4.25$","$-4\\ 1/4$","$-4.250$"],"answer":"C","solution":"A mixed number is never accepted, with or without a minus sign. The other three are all five or six characters, which is within the limit for a negative answer.","trap":"A) is the improper fraction, five characters; B) is the decimal, five characters; D) is the same decimal with a trailing zero, six characters, which is the limit for a negative answer and so still fits."},{"tag":"medium","stem":"A question's answer works out to $\\dfrac{3}{8}$. Written as a decimal, what would you type into the box?","answer":"0.375","solution":"$3 \\div 8 = 0.375$, which terminates and fits in five characters. Typing $3/8$ would also be accepted."},{"tag":"harder","stem":"The answer to a write-in question is $\\dfrac{1}{7}$. Which of the following decimal entries would be accepted?","choices":["$0.14$","$0.142$","$.1428$","$0.1428571$"],"answer":"C","solution":"$\\dfrac{1}{7}=0.142857\\ldots$, which does not terminate, so the entry must run to the fourth digit. $.1428$ does, and it is five characters.","trap":"A) stops at the second digit and B) at the third, and both are too early for a non-terminating decimal; D) is nine characters and will not fit in the box."},{"tag":"harder","stem":"A question asks for the value of $x$ and your working gives $x = \\dfrac{125}{1000}$. What is the shortest entry that would be accepted?","answer":"0.125","solution":"$\\dfrac{125}{1000}$ is eight characters, too long for the box. The decimal is $0.125$, which is five characters and terminates exactly. You could also enter $1/8$, which is shorter still."}],"notes":"The last one is the real-world version: a correct fraction that simply will not fit. The habit is to convert, not to panic."},{"type":"section","kicker":"Part three","title":"Desmos, and the two cheats","sub":"Three tools that turn a two-minute question into a twenty-second one."},{"type":"steps","kicker":"Tool one","title":"What Desmos is actually for","lead":"It is built into Bluebook and it is available on every single question, including the ones that look like they want mental arithmetic. Use it more than feels natural.","steps":[{"label":"Solving any equation","body":"Type $x^2-7x+12=0$ straight in. The graph crosses where the solutions are and Desmos labels the points."},{"label":"Systems of two equations","body":"Type both. Click the intersection. That is your $(x,y)$, with no algebra at all."},{"label":"Checking an answer you already have","body":"Faster than redoing the question, and it catches sign errors instantly."},{"label":"Not for: word problems","body":"Desmos cannot read. Setting up the equation is still yours — and that was always the harder half."}],"callout":"The habit to build this week: on every practice question, ask \"could Desmos have done this?\" before you move on. You are training the reflex, not the arithmetic.","notes":"Watch him do two questions in Desmos live. If his typing is slow, that is this week's drill — speed in the tool is part of the tool."},{"type":"compare","kicker":"Tool two","title":"Working backwards from the options","lead":"When a multiple-choice question asks for a value and the four options are plain numbers, you do not have to solve anything. Test them.","left":{"label":"Solving it forwards","body":"3(2x + 1) − 4 = 5(x + 3)\n6x + 3 − 4 = 5x + 15\n6x − 1 = 5x + 15\nx = 16\n\n…four lines, three chances\nto drop a sign."},"right":{"label":"Testing the options","body":"Start with C.\nIf x = 16:\nleft  = 3(33) − 4 = 95\nright = 5(19)    = 95\n\nEqual. Done, one line."},"callout":"Start with option B or C. If the two sides come out too big, you know to try a smaller option next, so one test usually eliminates two.","notes":"This is the technique that helps a weaker student most, because it replaces algebra he gets wrong with arithmetic he gets right."},{"type":"idea","kicker":"Tool three","title":"Picking numbers","lead":"When the question and all four options are written in letters rather than numbers, invent a number and see which option agrees.","points":["Choose something easy and unusual — $x=3$ is better than $x=0$, $x=1$ or $x=2$, which make too many options accidentally agree.","Work out the answer for your number.","Put the same number into all four options and keep whichever matches.","If two still match, try a second number and the tie breaks."],"callout":"This turns an abstract algebra question into arithmetic. It takes longer than the algebra when the algebra goes well — and much less time than the algebra going badly.","notes":"Pair this with back-solving: between them they cover most of the multiple-choice algebra he currently loses."},{"type":"practice","kicker":"Your turn","title":"Back-solving and picking numbers","lead":"Do each of these twice — once forwards, once by testing the options — and notice which was faster for you.","questions":[{"stem":"What value of $x$ satisfies $3(2x+1)-4=5(x+3)$?","answer":"16","solution":"Expand both sides: $6x+3-4=5x+15$, so $6x-1=5x+15$. Subtract $5x$: $x-1=15$, so $x=16$. Checking, $3(33)-4=95$ and $5(19)=95$.","tag":"medium"},{"stem":"What value of $x$ satisfies $2(3x-4)=5(x+2)$?","answer":"18","solution":"Distribute on both sides: $6x-8=5x+10$. Subtract $5x$: $x-8=10$. Add $8$: $x=18$. Checking, $2(3\\cdot 18-4)=100$ and $5(18+2)=100$.","tag":"medium"},{"stem":"What is the greater solution to $2x^2-5x-12=0$?","answer":"A","solution":"The expression factors as $(2x+3)(x-4)=0$, so $x=-\\dfrac{3}{2}$ or $x=4$. Checking $x=4$: $32-20-12=0$. The greater solution is $4$.","tag":"medium","choices":["$4$","$-\\dfrac{3}{2}$","$\\dfrac{3}{2}$","$\\dfrac{5}{2}$"],"trap":"B) is what you get if you picked the lesser of the two solutions; C) is what you get if you solved $2x+3=0$ as $2x=3$, losing the minus sign; D) is what you get if you reported $-\\dfrac{b}{2a}$, the midpoint of the solutions, rather than a solution."},{"stem":"In the system $x=3y-2$ and $4x+5y=60$, what is the value of $x$?","answer":"10","solution":"Since $x$ is already isolated, substitute: $4(3y-2)+5y=60$, so $12y-8+5y=60$ and $17y=68$, giving $y=4$. Then $x=3(4)-2=10$. Check: $4(10)+5(4)=40+20=60$.","tag":"medium"}],"notes":"The point is not the answers. It is which method he is faster and safer with, and he should leave knowing that about himself."},{"type":"section","kicker":"Part four","title":"A final timed run","sub":"Twelve questions, mixed, eighteen minutes. Three passes. Flag and move on."},{"type":"practice","kicker":"Timed run · 1–4","title":"Pass one","lead":"Six minutes. Anything without a route in fifteen seconds gets flagged.","questions":[{"stem":"What is the value of $-4-2(3-7)$?","answer":"C","solution":"Work inside the brackets first: $3-7=-4$. Then $-2(-4)=+8$, so the expression is $-4+8=4$.","tag":"medium","choices":["$-17$","$-12$","$4$","$24$"],"trap":"A) is what you get if you ignored the brackets and read the expression as $-4-2\\cdot 3-7=-17$; B) is what you get if you took $-2$ times $-4$ as $-8$, missing that two negatives give a positive, and wrote $-4-8=-12$; D) is what you get if you grouped from the left as $(-4-2)(3-7)=(-6)(-4)=24$."},{"stem":"What is the slope of the graph of $7x-2y=11$ in the $xy$-plane?","answer":"D","solution":"Solve for $y$: $-2y=-7x+11$, so $y=\\dfrac{7}{2}x-\\dfrac{11}{2}$. The slope is $\\dfrac{7}{2}$. Checking with $(1,-2)$ and $(3,5)$, both on the line: $\\dfrac{5-(-2)}{3-1}=\\dfrac{7}{2}$.","tag":"medium","choices":["$-\\dfrac{7}{2}$","$-\\dfrac{2}{7}$","$\\dfrac{2}{7}$","$\\dfrac{7}{2}$"],"trap":"A) is what you get if you divided $-7x$ by $2$ instead of by $-2$; B) is what you get if you inverted the fraction and kept a minus sign; C) is what you get if you wrote the coefficient of $y$ over the coefficient of $x$."},{"stem":"In the $xy$-plane, the graph of $4x-7y=-28$ crosses the $x$-axis at $(a,0)$. What is the value of $a$?","answer":"A","solution":"On the $x$-axis, $y=0$, so $4x-7(0)=-28$, giving $4x=-28$ and $x=-7$. The $x$-intercept is $(-7,0)$, so $a=-7$.","tag":"medium","choices":["$-7$","$-4$","$4$","$7$"],"trap":"B) is what you get if you found the $y$-intercept, $-7y=-28$ giving $y=4$, and then attached the wrong sign to it; C) is what you get if you found the $y$-intercept $y=4$ instead of the $x$-intercept; D) is what you get if you divided $28$ by $4$ and ignored the negative sign on the right side."},{"stem":"Which expression is equivalent to $3x^2-10x+8$?","answer":"B","solution":"The $3x^2$ comes from $3x\\cdot x$, and $8$ from two negatives since the middle term is negative and the constant positive. Testing $(3x-4)(x-2)$: the cross terms are $-6x$ and $-4x$, giving $-10x$. That matches, so the factorization is $(3x-4)(x-2)$.","tag":"medium","choices":["$(3x+4)(x+2)$","$(3x-4)(x-2)$","$(3x-2)(x-4)$","$(x-4)(x-2)$"],"trap":"A) is what you get if you used the right numbers but made both constants positive; C) is what you get if you swapped the two constants, which gives a middle term of $-14x$; D) is what you get if you factored as though the leading coefficient were $1$."}],"notes":"Start the clock and say nothing until it stops."},{"type":"practice","kicker":"Timed run · 5–8","title":"Pass one, continued","lead":"Six minutes.","questions":[{"stem":"A phone plan costs $25$ dollars per month plus $0.10$ dollars for each text message sent. One month the bill was $43$ dollars. How many text messages were sent that month?","answer":"180","solution":"Let $t$ be the number of texts. The bill is the fixed $25$ dollars plus $0.10t$ dollars, so $25+0.10t=43$. Subtracting $25$ gives $0.10t=18$, and dividing by $0.10$ gives $t=180$ texts.","tag":"medium"},{"stem":"What are the solutions to $x^2+x=4x+10$?","answer":"D","solution":"Bring every term to the left: $x^2+x-4x-10=0$, so $x^2-3x-10=0$ and $(x-5)(x+2)=0$. The solutions are $5$ and $-2$. Checking $x=-2$: $4-2=2$ and $-8+10=2$.","tag":"medium","choices":["$x=-5$ or $x=2$","$x=5$ or $x=2$","$x=0$ or $x=3$","$x=5$ or $x=-2$"],"trap":"A) is what you get if you reversed the sign of both solutions when factoring; B) is what you get if you used the factor pair of $10$ while ignoring that the constant is $-10$; C) is what you get if you subtracted $4x$ from both sides but forgot to subtract the $10$."},{"stem":"Which of the following describes all values of $x$ for which $4-7x<25$?","answer":"D","solution":"Subtract 4 from both sides: $-7x<21$. Divide by $-7$ and reverse the direction: $x>-3$. Test $x=-2$: $4-7(-2)=18<25$, true. Test $x=-4$: $4-7(-4)=32<25$, false. The solution is $x>-3$.","tag":"medium","choices":["$x<-3$","$x<3$","$x>3$","$x>-3$"],"trap":"A) is what you get if you divided by $-7$ without reversing the inequality sign; B) is what you get if you dropped the negative on the $x$-term, solving $7x<21$, and kept the direction; C) is what you get if you dropped the negative on the $x$-term and then reversed the direction."},{"stem":"A taxi fare $F$, in dollars, for a ride of $d$ miles is $F=3+1.60d$. Which values of $d$ make sense in this context?","answer":"B","solution":"A ride covers a distance that is zero or more, and that distance need not be a whole number of miles, so every $d \\ge 0$ makes sense.","tag":"medium","choices":["Whole numbers only","All values with $d \\ge 0$","All values with $d \\ge 3$","All values of $d$, including negative values"],"trap":"A) is what you get if you assumed a distance must be a whole number of miles; C) is what you get if you used the 3-dollar fixed fare as a lower limit on the distance; D) is what you get if you ignored the context, where a negative distance has no meaning."}],"notes":"Six minutes."},{"type":"practice","kicker":"Timed run · 9–12","title":"The harder end","lead":"Six minutes. These are the ones you would flag in a real module.","questions":[{"stem":"If $x^2+8x+11=(x+4)^2+k$ for every value of $x$, what is the value of the constant $k$?","answer":"B","solution":"Expanding, $(x+4)^2=x^2+8x+16$. That is $5$ more than $x^2+8x+11$, so $x^2+8x+11=(x+4)^2-5$ and $k=-5$. Checking at $x=0$: the original gives $11$, and $(0+4)^2-5=16-5=11$.","tag":"harder","choices":["$-16$","$-5$","$5$","$27$"],"trap":"A) is what you get if you subtracted the $16$ but left the original constant $11$ out; C) is what you get if you computed $16-11$ instead of $11-16$; D) is what you get if you added the $16$ from the completed square instead of subtracting it."},{"stem":"If $7x+2y=46$ and $5x+10y=50$, what is the value of $x+y$?","answer":"C","solution":"Check the symmetry first: the $x$-coefficients add to $7+5=12$ and the $y$-coefficients add to $2+10=12$. Because those two sums match, adding the equations as they stand gives a multiple of $x+y$: $12x+12y=46+50=96$, so $12(x+y)=96$ and $x+y=8$. (Solving fully gives $x=6$ and $y=2$, which agrees.)","tag":"harder","choices":["$4$","$6$","$8$","$96$"],"trap":"A) is what you get if you found $x-y=6-2$ instead of $x+y$; B) is what you get if you solved the system fully and reported $x$ alone; D) is what you get if you added the equations to get $12x+12y=96$ but did not divide by 12."},{"stem":"What is the sum of the solutions to $(x-4)(x+1)=14$?","answer":"3","solution":"Expand first: $x^2-3x-4=14$, so $x^2-3x-18=0$. The solutions add to $-\\dfrac{b}{a}=3$. Factoring confirms it: $(x-6)(x+3)=0$ gives $6$ and $-3$, and $6+(-3)=3$. Setting each original factor to $14$ would be invalid.","tag":"harder"},{"stem":"If $5(x-2)=3x+8$, what is the value of $2x+1$?","answer":"D","solution":"Distribute: $5x-10=3x+8$. Subtract $3x$ and add $10$: $2x=18$. The question asks for $2x+1$, which is $18+1=19$. (Here $x=9$, but that is not what was requested.)","tag":"medium","choices":["$9$","$11$","$18$","$19$"],"trap":"A) is what you get if you solved for $x$ and stopped at $x=9$ without evaluating $2x+1$; B) is what you get if you distributed to the first term only, solving $5x-2=3x+8$ to get $x=5$ and $2x+1=11$; C) is what you get if you found $2x=18$ but left off the $+1$."}],"notes":"Six minutes. Then review only the ones he got wrong, and only for the error type."},{"type":"section","kicker":"Part five","title":"Saturday","sub":"What to do with the last six days, and what to do on the morning itself."},{"type":"table","kicker":"The last week","title":"Six days, and what each is for","lead":"Cramming new topics now does not work. Consolidating does.","cols":["Day","What to do"],"rows":[{"cells":["Sunday to Tuesday","Twenty workbook questions a day, mixed topics, timed. Nothing new."]},{"cells":["Wednesday","Re-do every question in your error log, cold, without the notes."]},{"cells":["Thursday","One Bluebook module, timed, using the three-pass protocol. Last timed work."]},{"cells":["Friday","Nothing mathematical. Check the bag. Sleep early."],"flag":"good"},{"cells":["Saturday","Eat. Arrive early. Run the protocol."],"flag":"good"}],"callout":"Friday is a real instruction, not a kindness. A tired brain loses more marks than an under-revised one, and at this point the revision is done.","notes":"Say this to the parents too. The Friday-night cram is the single most common way a December score comes in below the November practice tests."},{"type":"recap","kicker":"The protocol, in one page","title":"What you do on the day","points":["Pass one: answer what you can see, flag anything with no route after fifteen seconds, reach the end of the module in about twenty minutes.","Pass two: spend the remaining time on the flagged questions, hardest last.","Pass three: re-read the ones you answered fastest. That is where the careless marks are.","Never leave a box empty — there is no penalty for a wrong answer.","Write-in answers: five characters, six if negative, no mixed numbers, no symbols, repeating decimals filled to the fourth digit.","Before you solve anything by hand, ask whether Desmos could do it, and whether the options could be tested instead."],"callout":"Module two feeling hard is a good sign. It means module one went well. Do not let it rattle you.","notes":"Have him write these six lines out himself on a card and take it to Thursday's module. Reading them is not the same as writing them."},{"type":"close","small":"5 December","big":"You are more ready than you were.","foot":"In September you scored 5 out of 22 and the single biggest cause was one sign mistake made seven times. That is fixed. The rest is pacing, entry format, and not giving a hard question more than it is worth — and you now have a rule for each of those. Go and use them.","notes":"End on this. He should leave the room with a protocol and a reason to believe it works, not with a list of what he still cannot do."}]};
</script>
<script>
/* ===========================================================
   SAT Math — slide engine
   Shared by every lesson deck. The deck's content is a DECK
   object defined before this script runs.
   =========================================================== */
(function () {
  "use strict";

  var stage = document.getElementById('stage');
  var railFill = document.getElementById('railFill');
  var counter = document.getElementById('counter');
  var deckName = document.getElementById('deckName');
  var overview = document.getElementById('overview');
  var ovGrid = document.getElementById('ovGrid');
  var notesEl = document.getElementById('notes');

  var i = 0, built = [], notesOn = false, reveal = 0;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  deckName.textContent = DECK.title;
  document.getElementById('deckSession').textContent = DECK.session || '';

  /* ---------- maths ---------- */
  var mathReady = false, mathFailed = false;
  function typeset(el) {
    if (window.MathJax && window.MathJax.typesetPromise) {
      mathReady = true;
      window.MathJax.typesetPromise([el]).catch(function () { plain(el); });
    } else if (mathFailed) { plain(el); }
  }
  setTimeout(function () {
    if (window.MathJax && window.MathJax.typesetPromise) return;
    mathFailed = true; plain(stage);
  }, 3000);
  function plain(el) {
    if (!el) return;
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n, hits = [];
    while ((n = w.nextNode())) { if (n.nodeValue.indexOf('$') > -1) hits.push(n); }
    hits.forEach(function (t) {
      t.nodeValue = t.nodeValue.replace(/\$\$?([^$]*)\$\$?/g, function (m, s) { return tidy(s); });
    });
  }
  var SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶',
    '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻', 'n': 'ⁿ', 'x': 'ˣ', 't': 'ᵗ', '/': 'ᐟ' };
  function sup(s) {
    var o = '', ok = true;
    for (var i = 0; i < s.length; i++) { if (SUP[s[i]]) o += SUP[s[i]]; else { ok = false; break; } }
    return ok ? o : '^(' + s + ')';
  }
  function tidy(t) {
    var s = String(t)
      .replace(/\{\s*,\s*\}/g, ',')                       // 64{,}000
      .replace(/\\(?:text|mathrm|mbox)\{([^{}]*)\}/g, '$1')
      .replace(/\\left|\\right/g, '')
      .replace(/\\([%&#_$])/g, '$1');                     // \% \$ \&
    for (var k = 0; k < 4; k++) {                         // innermost first, a few passes
      s = s.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)')
           .replace(/\\sqrt\s*\[\s*([^\]]*)\s*\]\s*\{([^{}]*)\}/g, '$1√($2)')
           .replace(/\\sqrt\s*\{([^{}]*)\}/g, '√($1)');
    }
    return s
      .replace(/\^\{([^{}]*)\}/g, function (m, e) { return sup(e); })
      .replace(/\^(-?\w)/g, function (m, e) { return sup(e); })
      .replace(/\\ge\b/g, '≥').replace(/\\le\b/g, '≤')
      .replace(/\\cdot/g, '·').replace(/\\neq/g, '≠').replace(/\\approx/g, '≈')
      .replace(/\\ldots|\\dots/g, '…').replace(/\\square/g, '□')
      .replace(/\\pi\b/g, 'π').replace(/\\theta\b/g, 'θ').replace(/\\ell\b/g, 'ℓ')
      .replace(/\\circ\b/g, '°').replace(/\\infty/g, '∞')
      .replace(/\\times/g, '×').replace(/\\div/g, '÷').replace(/\\pm/g, '±')
      .replace(/\\[;,:! ]/g, ' ').replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '')
      .replace(/\((\w+)\)\/\((\w+)\)/g, '$1/$2')          // (3)/(4) -> 3/4
      .replace(/\s+/g, ' ').trim();
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- slide builders ---------- */
  var B = {
    title: function (d) {
      return '<div class="sl sl-title">' +
        '<div class="eyebrow r">' + esc(d.eyebrow || DECK.session || '') + '</div>' +
        '<h1 class="r">' + esc(d.title) + '</h1>' +
        (d.sub ? '<p class="lede r">' + esc(d.sub) + '</p>' : '') +
        (d.meta ? '<div class="tmeta r">' + d.meta.map(function (m) {
          return '<span><b>' + esc(m.v) + '</b>' + esc(m.k) + '</span>'; }).join('') + '</div>' : '') +
        '</div>';
    },
    section: function (d) {
      return '<div class="sl sl-section">' +
        (d.kicker ? '<div class="eyebrow r">' + esc(d.kicker) + '</div>' : '') +
        '<h2 class="r">' + esc(d.title) + '</h2>' +
        (d.sub ? '<p class="lede r">' + esc(d.sub) + '</p>' : '') + '</div>';
    },
    idea: function (d) {
      return '<div class="sl">' + head(d) +
        (d.lead ? '<p class="lead r">' + esc(d.lead) + '</p>' : '') +
        (d.points ? '<ul class="pts">' + d.points.map(function (p) {
          return '<li class="r"><span class="dot"></span><span>' + esc(p) + '</span></li>'; }).join('') + '</ul>' : '') +
        (d.callout ? '<div class="callout r">' + esc(d.callout) + '</div>' : '') +
        '</div>';
    },
    table: function (d) {
      return '<div class="sl">' + head(d) +
        (d.lead ? '<p class="lead r">' + esc(d.lead) + '</p>' : '') +
        '<div class="tw r"><table><thead><tr>' +
        d.cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
        '</tr></thead><tbody>' +
        d.rows.map(function (row) {
          return '<tr class="' + (row.flag || '') + '">' + row.cells.map(function (c, j) {
            return '<td' + (j === 0 ? ' class="k"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>' +
        (d.callout ? '<div class="callout r">' + esc(d.callout) + '</div>' : '') + '</div>';
    },
    steps: function (d) {
      return '<div class="sl">' + head(d) +
        (d.lead ? '<p class="lead r">' + esc(d.lead) + '</p>' : '') +
        '<ol class="steps">' + d.steps.map(function (s, n) {
          return '<li class="r step"><i>' + (n + 1) + '</i><div><b>' + esc(s.label) + '</b>' +
            (s.body ? '<span>' + esc(s.body) + '</span>' : '') + '</div></li>';
        }).join('') + '</ol>' +
        (d.callout ? '<div class="callout r">' + esc(d.callout) + '</div>' : '') + '</div>';
    },
    compare: function (d) {
      return '<div class="sl">' + head(d) +
        (d.lead ? '<p class="lead r">' + esc(d.lead) + '</p>' : '') +
        '<div class="cmp">' +
        '<div class="card bad r"><div class="ctag">' + esc(d.left.label) + '</div><div class="cbody">' +
        esc(d.left.body).replace(/\n/g, '<br>') + '</div></div>' +
        '<div class="card good r"><div class="ctag">' + esc(d.right.label) + '</div><div class="cbody">' +
        esc(d.right.body).replace(/\n/g, '<br>') + '</div></div></div>' +
        (d.callout ? '<div class="callout r">' + esc(d.callout) + '</div>' : '') + '</div>';
    },
    worked: function (d) {
      return '<div class="sl sl-worked">' + head(d) +
        '<div class="qbox r"><div class="qtag">Question</div><div class="qstem">' + esc(d.question) + '</div></div>' +
        (d.thinking ? '<div class="think r"><b>First, notice</b>' + esc(d.thinking) + '</div>' : '') +
        '<ol class="wsteps">' + d.steps.map(function (s, n) {
          return '<li class="r"><i>' + (n + 1) + '</i><div>' + esc(s) + '</div></li>';
        }).join('') + '</ol>' +
        '<div class="ans r"><span>Answer</span><b>' + esc(d.answer) + '</b></div></div>';
    },
    practice: function (d, idx) {
      return '<div class="sl sl-practice">' + head(d) +
        (d.lead ? '<p class="lead r">' + esc(d.lead) + '</p>' : '') +
        '<div class="qgrid n' + d.questions.length + '">' +
        d.questions.map(function (q, j) { return qCard(q, idx + '-' + j); }).join('') +
        '</div>' +
        '<button class="revealAll r" data-all>Show every answer</button></div>';
    },
    recap: function (d) {
      return '<div class="sl">' + head(d) +
        '<ul class="recap">' + d.points.map(function (p, n) {
          return '<li class="r"><i>' + (n + 1) + '</i><span>' + esc(p) + '</span></li>'; }).join('') + '</ul>' +
        (d.callout ? '<div class="callout r">' + esc(d.callout) + '</div>' : '') + '</div>';
    },
    close: function (d) {
      return '<div class="sl sl-section sl-close">' +
        (d.small ? '<div class="eyebrow r">' + esc(d.small) + '</div>' : '') +
        '<h2 class="r">' + esc(d.big) + '</h2>' +
        (d.foot ? '<p class="lede r">' + esc(d.foot) + '</p>' : '') + '</div>';
    }
  };

  function head(d) {
    return (d.kicker ? '<div class="eyebrow r">' + esc(d.kicker) + '</div>' : '') +
      '<h2 class="r sh">' + esc(d.title) + '</h2>';
  }

  function qCard(q, key) {
    var mc = !!(q.choices && q.choices.length);
    var h = '<div class="q" data-q="' + key + '">' +
      '<div class="qhead">' + (q.tag ? '<span class="chip">' + esc(q.tag) + '</span>' : '') +
      (mc ? '' : '<span class="chip w">write your answer</span>') + '</div>' +
      '<div class="qs">' + esc(q.stem) + '</div>';
    if (mc) {
      h += '<ul class="opts">' + q.choices.map(function (c, j) {
        return '<li data-l="' + 'ABCD'[j] + '"><kbd>' + 'ABCD'[j] + '</kbd><span>' + esc(c) + '</span></li>';
      }).join('') + '</ul>';
    }
    h += '<button class="show">Show answer</button>' +
      '<div class="sol" hidden><div class="solA">' +
      (mc ? esc(q.answer) + ')&nbsp; ' + esc(q.choices['ABCD'.indexOf(q.answer)]) : esc(q.answer)) +
      '</div><div class="solT">' + esc(q.solution) + '</div>' +
      (q.trap ? '<div class="solW"><b>The usual slip</b> ' + esc(q.trap) + '</div>' : '') +
      '</div></div>';
    return h;
  }

  /* ---------- build ---------- */
  DECK.slides.forEach(function (d, n) {
    var el = document.createElement('section');
    el.className = 'slide';
    el.innerHTML = (B[d.type] || B.idea)(d, n);
    el.hidden = true;
    stage.appendChild(el);
    built.push({ el: el, data: d });
  });

  // overview
  ovGrid.innerHTML = DECK.slides.map(function (d, n) {
    return '<button class="ovc" data-go="' + n + '"><i>' + (n + 1) + '</i><span>' +
      esc(d.title || d.big || DECK.title) + '</span></button>';
  }).join('');
  ovGrid.addEventListener('click', function (e) {
    var b = e.target.closest('[data-go]'); if (!b) return;
    go(parseInt(b.dataset.go, 10)); closeOverview();
  });

  /* ---------- navigation ---------- */
  function revealables(el) { return [].slice.call(el.querySelectorAll('.r')); }

  function paint(dir) {
    var cur = built[i];
    built.forEach(function (b, n) { if (n !== i) { b.el.hidden = true; b.el.className = 'slide'; } });
    cur.el.hidden = false;
    cur.el.className = 'slide in' + (reduce ? ' nomo' : (dir < 0 ? ' back' : ''));
    var rs = revealables(cur.el);
    rs.forEach(function (r, n) {
      r.classList.remove('on');
      r.style.setProperty('--d', (reduce ? 0 : n * 55) + 'ms');
    });
    // first paint shows everything except stepped lists
    reveal = 0;
    rs.forEach(function (r) { r.classList.add('on'); });
    railFill.style.width = ((i + 1) / built.length * 100) + '%';
    counter.textContent = (i + 1) + ' / ' + built.length;
    notesEl.textContent = cur.data.notes || 'No note for this slide.';
    typeset(cur.el);
    if (mathFailed) plain(cur.el);
  }

  function go(n, dir) {
    if (n < 0 || n >= built.length) return;
    var d = dir !== undefined ? dir : (n > i ? 1 : -1);
    i = n; paint(d);
    try { location.hash = 's' + (i + 1); } catch (e) { }
    try { localStorage.setItem('satdeck.' + DECK.id, String(i)); } catch (e) { }
  }
  function next() { if (i < built.length - 1) go(i + 1, 1); }
  function prev() { if (i > 0) go(i - 1, -1); }

  document.getElementById('next').addEventListener('click', next);
  document.getElementById('prev').addEventListener('click', prev);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); prev(); }
    else if (k === 'Home') { e.preventDefault(); go(0); }
    else if (k === 'End') { e.preventDefault(); go(built.length - 1); }
    else if (k === 'o' || k === 'O') { e.preventDefault(); toggleOverview(); }
    else if (k === 'Escape') { closeOverview(); }
    else if (k === 'n' || k === 'N') { notesOn = !notesOn; notesEl.hidden = !notesOn; }
    else if (k === 'f' || k === 'F') { toggleFull(); }
  });

  // swipe
  var tx = 0, ty = 0;
  stage.addEventListener('touchstart', function (e) {
    tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
  }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) { dx < 0 ? next() : prev(); }
  }, { passive: true });

  // answers
  stage.addEventListener('click', function (e) {
    var all = e.target.closest('[data-all]');
    if (all) {
      all.closest('.sl').querySelectorAll('.q').forEach(function (q) { openQ(q); });
      all.textContent = 'All answers shown'; all.disabled = true; return;
    }
    var btn = e.target.closest('.show');
    if (btn) { openQ(btn.closest('.q')); return; }
    var opt = e.target.closest('.opts li');
    if (opt) {
      var box = opt.closest('.q');
      if (box.classList.contains('open')) return;
      box.querySelectorAll('.opts li').forEach(function (o) { o.classList.remove('pick'); });
      opt.classList.add('pick');
    }
  });
  function openQ(box) {
    if (!box || box.classList.contains('open')) return;
    box.classList.add('open');
    var sol = box.querySelector('.sol'); sol.hidden = false;
    var a = sol.querySelector('.solA').textContent.trim().charAt(0);
    box.querySelectorAll('.opts li').forEach(function (o) {
      if (o.dataset.l === a) o.classList.add('right');
      else if (o.classList.contains('pick')) o.classList.add('wrong');
    });
    typeset(sol); if (mathFailed) plain(sol);
  }

  /* ---------- overview, fullscreen ---------- */
  function toggleOverview() { overview.hidden ? openOverview() : closeOverview(); }
  function openOverview() { overview.hidden = false; requestAnimationFrame(function () { overview.classList.add('on'); }); }
  function closeOverview() { overview.classList.remove('on'); setTimeout(function () { overview.hidden = true; }, 220); }
  document.getElementById('ovBtn').addEventListener('click', toggleOverview);
  overview.addEventListener('click', function (e) { if (e.target === overview) closeOverview(); });

  function toggleFull() {
    var r = document.documentElement;
    if (!document.fullscreenElement && r.requestFullscreen) r.requestFullscreen().catch(function () { });
    else if (document.exitFullscreen) document.exitFullscreen().catch(function () { });
  }
  document.getElementById('fsBtn').addEventListener('click', toggleFull);

  document.getElementById('notesBtn').addEventListener('click', function () {
    notesOn = !notesOn; notesEl.hidden = !notesOn;
  });

  /* ---------- start ---------- */
  var start = 0;
  var m = (location.hash || '').match(/^#s(\d+)$/);
  if (m) start = Math.min(built.length - 1, Math.max(0, parseInt(m[1], 10) - 1));
  else { try { var v = localStorage.getItem('satdeck.' + DECK.id); if (v !== null) start = Math.min(built.length - 1, parseInt(v, 10) || 0); } catch (e) { } }
  i = start; paint(1);

  // MathJax loads async — typeset once it lands.
  var waited = 0, poll = setInterval(function () {
    waited += 120;
    if (window.MathJax && window.MathJax.typesetPromise) {
      clearInterval(poll); mathReady = true; typeset(built[i].el);
    } else if (waited > 3000) { clearInterval(poll); }
  }, 120);
})();

</script>
